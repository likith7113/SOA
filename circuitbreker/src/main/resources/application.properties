spring.application.name=circuitbreker
server.port=8080
resilience4j.retry.instances.demoRetry.max-attempts=3
resilience4j.retry.instances.demoRetry.wait-duration=1s
resilience4j.timelimiter.instances.demoTimeout.timeout-duration=2s
resilience4j.circuitbreaker.instances.demoCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.demoCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.demoCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.demoCB.wait-duration-in-open-state=10s